<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>AutomataFlow — Free Online Automata Simulator for DFA, NFA, PDA &amp; Turing Machines</title>
    <meta name="description" content="AutomataFlow is a free, browser-based automata simulator for DFA, NFA, PDA, and Turing Machines. No download, no Java. Simulate, visualize, and teach theoretical computer science directly in your browser." />
    <meta name="keywords" content="automata simulator, automaten simulator, DFA simulator, NFA simulator, PDA simulator, Turing machine simulator, finite automaton, pushdown automaton, theoretical computer science, TCS, formal languages, online automata, JFLAP alternative, Automatentheorie, endlicher Automat, Turingmaschine, Kellerautomat" />
    <meta name="author" content="Marin Benke" />
    <link rel="canonical" href="https://automataflow.marinbenke.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AutomataFlow — Free Online Automata Simulator" />
    <meta property="og:description" content="Simulate DFA, NFA, PDA, and Turing Machines in your browser. No download, no Java required. Perfect for learning theoretical computer science." />
    <meta property="og:url" content="https://automataflow.marinbenke.dev/" />
    <meta property="og:site_name" content="AutomataFlow" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="de_DE" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AutomataFlow — Free Online Automata Simulator" />
    <meta name="twitter:description" content="Simulate DFA, NFA, PDA, and Turing Machines in your browser. No download, no Java required." />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "AutomataFlow",
      "url": "https://automataflow.marinbenke.dev/",
      "description": "Free browser-based simulator for finite automata, pushdown automata, and Turing machines. Designed for teaching and exploring theoretical computer science.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires a modern web browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      },
      "author": {
        "@type": "Person",
        "name": "Marin Benke",
        "url": "https://marinbenke.dev"
      },
      "keywords": ["DFA", "NFA", "PDA", "Turing Machine", "automata simulator", "theoretical computer science", "Automatentheorie"]
    }
    </script>

    <!-- WebSite schema: steers Google's displayed site name to "AutomataFlow" -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AutomataFlow",
      "alternateName": "AutomataFlow Simulator",
      "url": "https://automataflow.marinbenke.dev/"
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
